name: Deploy Portal Transparencia

on:
  push:
    branches:
      - master  # Confirmamos que sua branch é master pelo log anterior

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      # Conecta o computador do GitHub na sua rede Tailscale
      - name: Conectar ao Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      # Entra no servidor via SSH e reinicia o PM2
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /home/tefe-portaltransparencia/htdocs
            git pull origin master
            npm install --production
            pm2 reload transparencia --update-env
